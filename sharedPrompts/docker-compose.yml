version: '3.9'

services:
  redis:
    image: redis:7.4.6
    container_name: sharedprompts_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - sharedprompts_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sharedprompts_rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sharedprompts_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:

networks:
  sharedprompts_network:
    driver: bridge
