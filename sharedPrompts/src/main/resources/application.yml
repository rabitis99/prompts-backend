# =========================
# 서버 설정
# =========================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  shutdown: graceful

# =========================
# Spring Config
# =========================
spring:
  config:
    import: optional:file:.env[.properties]

  web:
    resources:
      add-mappings: false

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  # =========================
  # OAuth2 클라이언트
  # =========================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [ email, profile ]
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            client-name: Google
            authorization-grant-type: authorization_code

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            scope: [ name, email ]
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            client-name: Naver
            authorization-grant-type: authorization_code

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            scope: [ profile_nickname, profile_image ]
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-name: Kakao
            authorization-grant-type: authorization_code

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # =========================
  # 데이터베이스
  # =========================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 커넥션 풀 설정은 환경별 파일(application-dev.yml, application-prod.yml)에서 관리

  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false  # N+1 쿼리 방지 및 성능 최적화
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        # MySQL 8.0+ 자동 감지되므로 명시 불필요, 하지만 명시 시 최신 MySQLDialect 사용
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}
        jdbc:
          batch_size: ${HIBERNATE_BATCH_SIZE:50}

  # =========================
  # Redis
  # =========================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis 연결 풀 및 타임아웃 설정은 환경별 파일(application-dev.yml, application-prod.yml)에서 관리
    web:
      pageable:
        max-page-size: 100

  # =========================
  # RabbitMQ
  # =========================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # RabbitMQ 연결 풀 및 발행 설정은 환경별 파일(application-dev.yml, application-prod.yml)에서 관리
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: ${RABBITMQ_PREFETCH:10}
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2

  # =========================
  # Thymeleaf
  # =========================
  thymeleaf:
    check-template-location: false  # 템플릿 위치 확인 비활성화 (REST API만 사용 시)

  # =========================
  # Spring AI
  # =========================
  # 개발 환경에서는 선택적, 프로덕션 환경에서는 필수
  # 프로덕션 환경에서는 application-prod.yml에서 명시적으로 설정됩니다.
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}  # 개발 환경: 선택적, 프로덕션: 필수
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:gpt-4o-mini}
          temperature: ${SPRING_AI_OPENAI_TEMPERATURE:0.7}

# =========================
# Redis Health Check 설정
# =========================
redis:
  health-check:
    enabled: ${REDIS_HEALTH_CHECK_ENABLED:true}
    interval-ms: ${REDIS_HEALTH_CHECK_INTERVAL_MS:5000}
    max-consecutive-failures: ${REDIS_HEALTH_CHECK_MAX_CONSECUTIVE_FAILURES:3}
  # Redis 재시작 설정
  restart:
    # Redis 재시작 기능 활성화 여부 (보안상 기본값: false)
    enabled: ${REDIS_RESTART_ENABLED:false}
    # Redis 재시작 명령어
    # 예시:
    #   Linux (systemd): systemctl restart redis
    #   Linux (service): service redis restart
    #   Windows: net stop redis && net start redis
    #   Docker: docker restart redis-container
    command: ${REDIS_RESTART_COMMAND:}
    # 재시작 명령어 실행 타임아웃 (초)
    timeout-seconds: ${REDIS_RESTART_TIMEOUT_SECONDS:30}

# =========================
# Discord 웹훅 알림 설정
# =========================
discord:
  webhook:
    # Discord 웹훅 URL (선택적)
    # Discord 채널 설정 > 연동 > 웹후크 > 새 웹후크 만들기에서 URL을 복사하여 설정
    url: ${DISCORD_WEBHOOK_URL:}
    # Discord 알림 활성화 여부
    enabled: ${DISCORD_WEBHOOK_ENABLED:false}

# =========================
# ShedLock 설정
# =========================
shedlock:
  fallback:
    # Redis 장애 시 DB 기반 LockProvider로 자동 전환 여부
    # true: Redis 장애 시 자동으로 DB로 전환 (권장)
    #   - DB LockProvider 사용 시 'shedlock' 테이블이 필요함
    #   - 테이블 생성 SQL: src/main/resources/db/migration/shedlock.sql
    # false: Redis만 사용 (Redis 장애 시 스케줄러 중단)
    #   - DB 테이블이 없어도 됨
    enabled: ${SHEDLOCK_FALLBACK_ENABLED:true}
  table:
    # ShedLock 테이블 자동 생성 여부
    # true: 애플리케이션 시작 시 테이블이 없으면 자동 생성 (개발 환경용)
    # false: 수동으로 테이블 생성 필요 (프로덕션 환경 권장)
    auto-create: ${SHEDLOCK_TABLE_AUTO_CREATE:false}

# =========================
# JWT
# =========================
jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION}
    rotation-threshold-days: ${JWT_REFRESH_ROTATION_THRESHOLD_DAYS:1}

# =========================
# OAuth2 커스텀 설정
# =========================
oauth2:
  failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL}
  salt: ${OAUTH2_SALT}
  state:
    validity-minutes: ${OAUTH2_STATE_VALIDITY_MINUTES:10}
  redirect:
    front-url: ${OAUTH2_REDIRECT_FRONT_URL}

# =========================
# 쿠키 보안 설정
# =========================
auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

# =========================
# 비밀번호 정책
# =========================
password:
  policy:
    min-length: ${PASSWORD_MIN_LENGTH:10}
    max-length: ${PASSWORD_MAX_LENGTH:100}
    require-upper-case: ${PASSWORD_REQUIRE_UPPER_CASE:true}
    require-lower-case: ${PASSWORD_REQUIRE_LOWER_CASE:true}
    require-digit: ${PASSWORD_REQUIRE_DIGIT:true}
    require-special-char: ${PASSWORD_REQUIRE_SPECIAL_CHAR:true}
    special-chars: ${PASSWORD_SPECIAL_CHARS:!@#$%^&*()_+-=[]{}|;:,.<>?}

# =========================
# CORS
# =========================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# =========================
# AI (Gemini)
# =========================
google:
  gemini:
    api-key: ${GOOGLE_GEMINI_API_KEY}
    model: ${GOOGLE_GEMINI_MODEL}
    base-url: ${GOOGLE_GEMINI_BASE_URL}
    timeout-seconds: ${GOOGLE_GEMINI_TIMEOUT_SECONDS:30}

# =========================
# Resilience4j CircuitBreaker
# =========================
resilience4j:
  circuitbreaker:
    instances:
      googleGemini:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        slowCallRateThreshold: 70
        slowCallDurationThreshold: 15s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 10
      # Redis 토큰 서비스용 Circuit Breaker
      # Fail-Open 정책과 연동하여 Redis 장애 시 서비스 연속성 보장
      tokenRedis:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20  # 최근 20개 호출 기준으로 실패율 계산
        failureRateThreshold: 50  # 실패율 50% 시 Circuit Breaker Open
        slowCallRateThreshold: 80  # 느린 호출 비율 80% 시 Circuit Breaker Open
        slowCallDurationThreshold: 2s  # 2초 이상 소요 시 느린 호출로 간주
        waitDurationInOpenState: 30s  # Open 상태에서 30초 후 Half-Open으로 전환
        permittedNumberOfCallsInHalfOpenState: 5  # Half-Open 상태에서 5개 호출 허용
        minimumNumberOfCalls: 20  # 최소 20개 호출 후 통계 계산
        recordExceptions:
          - org.springframework.dao.DataAccessException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - org.springframework.data.redis.RedisConnectionFailureException
        ignoreExceptions:
          - org.example.sharedprompts.global.exception.ApiException
      # AI Production 서비스용 Circuit Breaker
      # AI 제공자 장애 시 빠른 실패 반환으로 스레드풀 고갈 방지
      aiProduction:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20  # 최근 20개 호출 기준으로 실패율 계산
        failureRateThreshold: 50  # 실패율 50% 시 Circuit Breaker Open
        slowCallRateThreshold: 70  # 느린 호출 비율 70% 시 Circuit Breaker Open
        slowCallDurationThreshold: 30s  # 30초 이상 소요 시 느린 호출로 간주 (AI 호출은 오래 걸릴 수 있음)
        waitDurationInOpenState: 60s  # Open 상태에서 60초 후 Half-Open으로 전환
        permittedNumberOfCallsInHalfOpenState: 3  # Half-Open 상태에서 3개 호출 허용
        minimumNumberOfCalls: 10  # 최소 10개 호출 후 통계 계산
        recordExceptions:
          - java.lang.RuntimeException
          - java.io.IOException
          - java.util.concurrent.TimeoutException

# =========================
# 알림 설정
# =========================
notification:
  sse:
    timeout: ${NOTIFICATION_SSE_TIMEOUT:1800000}
    cleanup-interval: ${NOTIFICATION_SSE_CLEANUP_INTERVAL:300000}
  duplicate:
    check-window-minutes: ${NOTIFICATION_DUPLICATE_CHECK_WINDOW:5}
  cleanup:
    enabled: ${NOTIFICATION_CLEANUP_ENABLED:true}
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
    schedule: ${NOTIFICATION_CLEANUP_SCHEDULE:0 0 2 * * ?}
  cache:
    unread-count-ttl: ${NOTIFICATION_UNREAD_COUNT_TTL:60}

# =========================
# 통계 설정
# =========================
statistics:
  cache:
    ttl: ${STATISTICS_CACHE_TTL:300}

# =========================
# Rate Limit 설정
# =========================
rate-limit:
  rules:
    login: ${RATE_LIMIT_LOGIN:5}
    signup: ${RATE_LIMIT_SIGNUP:3}
    confirm: ${RATE_LIMIT_CONFIRM:5}
    promptCreate: ${RATE_LIMIT_PROMPT_CREATE:10}
    general: ${RATE_LIMIT_GENERAL:100}
  windows:
    defaultSeconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  log:
    cleanup:
      enabled: ${RATE_LIMIT_LOG_CLEANUP_ENABLED:true}
      retention-days: ${RATE_LIMIT_LOG_CLEANUP_RETENTION_DAYS:90}
  failure-policy:
    # Redis 장애 시 Rate Limit 체크 실패 정책
    # true: Fail-Open (요청 허용, 가용성 우선) - 기본값
    # false: Fail-Closed (요청 차단, 보안 우선)
    fail-open: ${RATE_LIMIT_FAILURE_POLICY_FAIL_OPEN:true}
    # 장애 로깅 활성화 여부
    # true: Redis 장애 시 상세 로깅 수행
    log-failure: ${RATE_LIMIT_FAILURE_POLICY_LOG_FAILURE:true}

# =========================
# 애플리케이션 설정
# =========================
app:
  redis:
    hot-ttl-seconds: ${APP_REDIS_HOT_TTL_SECONDS:86400}
  prompt:
    creation:
      # 프롬프트 생성 타임아웃 설정 (밀리초)
      timeout-ms: ${APP_PROMPT_CREATION_TIMEOUT_MS:40000}

# =========================
# Job 복구 설정
# =========================
job:
  recovery:
    # 최대 재시도 횟수
    max-retry-count: ${JOB_RECOVERY_MAX_RETRY_COUNT:3}
    # Job 만료 기준 시간 (분)
    stale-job-threshold-minutes: ${JOB_RECOVERY_STALE_JOB_THRESHOLD_MINUTES:30}

# =========================
# 관리자 유지보수 작업 설정
# =========================
admin:
  maintenance:
    rebuild:
      # 페이지 크기 (한 번에 처리할 데이터 건수)
      page-size: ${ADMIN_MAINTENANCE_REBUILD_PAGE_SIZE:1000}
      # 글로벌 상태 관리 사용 여부 (멀티 인스턴스 환경에서 Redis 기반 상태 공유)
      use-global-status: ${ADMIN_MAINTENANCE_REBUILD_USE_GLOBAL_STATUS:false}
      lock:
        # Lock 이름
        name: ${ADMIN_MAINTENANCE_REBUILD_LOCK_NAME:AdminMaintenanceService_rebuildLikeCounts}
        # 최대 Lock 유지 시간 (작업이 이 시간보다 오래 걸리면 자동 해제)
        lock-at-most-for: ${ADMIN_MAINTENANCE_REBUILD_LOCK_AT_MOST_FOR:1h}
        # 최소 Lock 유지 시간 (작업 완료 후 최소 이 시간 동안 Lock 유지)
        lock-at-least-for: ${ADMIN_MAINTENANCE_REBUILD_LOCK_AT_LEAST_FOR:30m}
      retry:
        # 재시도 활성화 여부
        enabled: ${ADMIN_MAINTENANCE_REBUILD_RETRY_ENABLED:false}
        # 최대 재시도 횟수
        max-retries: ${ADMIN_MAINTENANCE_REBUILD_RETRY_MAX_RETRIES:3}
        # 재시도 간 지연 시간 (밀리초)
        retry-delay-ms: ${ADMIN_MAINTENANCE_REBUILD_RETRY_DELAY_MS:1000}
      batch:
        # 배치 처리 활성화 여부 (성능 최적화)
        enabled: ${ADMIN_MAINTENANCE_REBUILD_BATCH_ENABLED:true}
        # 배치 크기 (한 번에 Redis에 저장할 건수)
        size: ${ADMIN_MAINTENANCE_REBUILD_BATCH_SIZE:100}

# =========================
# Actuator 설정
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      # ⚠️ 보안: 프로덕션 환경에서는 Actuator 엔드포인트에 인증을 추가해야 합니다.
      # SecurityConfig에서 Actuator 엔드포인트 보안 설정을 확인하세요.
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

# =========================
# 비동기 예외 처리 설정
# =========================
async:
  exception:
    # 중요 비즈니스 로직 메서드 패턴 목록
    # 메서드 이름(클래스명.메서드명)에 이 패턴이 포함되면 알람 발송
    critical-method-patterns:
      - AuthEventListener
      - Payment
      - Audit
      - RateLimitLogBatchService

# =========================
# 태그 카운트 업데이트 설정
# =========================
tag:
  count:
    update:
      # 모니터링 활성화 여부
      enable-monitoring: ${TAG_COUNT_UPDATE_ENABLE_MONITORING:true}
      # Dead Letter Queue 활성화 여부
      enable-dlq: ${TAG_COUNT_UPDATE_ENABLE_DLQ:true}
      # 트랜잭션 없는 환경에서 동기 처리 여부
      # true: 즉시 동기 처리 (테스트/배치 환경)
      # false: 비동기 이벤트 발행 (기본값, 운영 환경)
      sync-fallback: ${TAG_COUNT_UPDATE_SYNC_FALLBACK:false}
    # 재시도 큐 처리 간격 (밀리초)
    retry:
      process-interval: ${TAG_COUNT_RETRY_PROCESS_INTERVAL:5000}  # 5초
    # DLQ 처리 간격 (밀리초)
    dlq:
      process-interval: ${TAG_COUNT_DLQ_PROCESS_INTERVAL:3600000}  # 1시간

# =========================
# 결제 설정
# =========================
payment:
  # 결제 기능 활성화 여부 (false면 결제 관련 빈이 로드되지 않아 환경변수 없이도 부팅 가능)
  enabled: ${PAYMENT_ENABLED:true}
  kakao:
    secret: ${PAYMENT_KAKAO_SECRET:}
    cid: ${PAYMENT_KAKAO_CID:TC0ONETIME}
    approval-url: ${PAYMENT_KAKAO_APPROVAL_URL}
    cancel-url: ${PAYMENT_KAKAO_CANCEL_URL}
    fail-url: ${PAYMENT_KAKAO_FAIL_URL}
  toss:
    api-key: ${PAYMENT_TOSS_API_KEY:}
    secret-key: ${PAYMENT_TOSS_SECRET_KEY:}
    base-url: ${PAYMENT_TOSS_BASE_URL:https://api.tosspayments.com/v1/payments}
    confirm-endpoint: ${PAYMENT_TOSS_CONFIRM_ENDPOINT:/confirm}
  paypal:
    client-id: ${PAYMENT_PAYPAL_CLIENT_ID:}
    client-secret: ${PAYMENT_PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYMENT_PAYPAL_WEBHOOK_ID}
    cancel-url: ${PAYMENT_PAYPAL_CANCEL_URL}
    return-url: ${PAYMENT_PAYPAL_RETURN_URL}

  exchange-rate:
    api-key: ${EXCHANGE_RATE_API_KEY:}
    api-url: ${EXCHANGE_RATE_API_URL:https://api.exchangerate-api.com/v4/latest/}
    # 환율 업데이트 스케줄러 주기 (cron 표현식)
    # 기본값: 매 시간 정각 (1시간 간격) - 0 0 * * * ?
    # 다른 예시: 매일 새벽 2시 (0 0 2 * * ?), 30분 간격 (0 0/30 * * * ?)
    schedule: ${EXCHANGE_RATE_SCHEDULE:0 0 * * * ?}
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET:}
  retry:
    max-attempts: ${PAYMENT_RETRY_MAX_ATTEMPTS:3}
    delay-ms: ${PAYMENT_RETRY_DELAY_MS:1000}
  cashback:
    rate: ${PAYMENT_CASHBACK_RATE:0.01}  # 1%
  point:
    rate: ${PAYMENT_POINT_RATE:0.005}  # 0.5%
  fcm:
    enabled: ${PAYMENT_FCM_ENABLED:true}
    project-id: ${PAYMENT_FCM_PROJECT_ID:sharedprompt-8ed9d}
    credentials-path: ${PAYMENT_FCM_CREDENTIALS_PATH:}
    classpath-resource: ${PAYMENT_FCM_CLASSPATH_RESOURCE:firebase/sharedprompt-8ed9d-firebase-adminsdk-fbsvc-601af9062b.json}

# =========================
# Production Storage 설정
# =========================
production:
  storage:
    type: ${PRODUCTION_STORAGE_TYPE:LOCAL}
    local:
      base-path: ${PRODUCTION_STORAGE_LOCAL_BASE_PATH:./storage/production}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      prefix: ${AWS_S3_PREFIX:production}

# =========================
# Artifact URL 설정
# =========================
artifact:
  url:
    default-ttl: ${ARTIFACT_URL_DEFAULT_TTL:300}  # Presigned URL 기본 TTL (초, 기본값: 5분)

# =========================
# 썸네일 설정
# =========================
thumbnail:
  sizes: ${THUMBNAIL_SIZES:200,400}
  enabled: ${THUMBNAIL_ENABLED:true}

# =========================
# CDN 설정
# =========================
cdn:
  enabled: ${CDN_ENABLED:false}
  domain: ${CDN_DOMAIN:}
  ttl: ${CDN_TTL:86400}

# =========================
# 스토리지 라이프사이클 설정
# =========================
storage:
  lifecycle:
    enabled: ${STORAGE_LIFECYCLE_ENABLED:false}
    glacier-days: ${STORAGE_GLACIER_DAYS:30}
    deep-archive-days: ${STORAGE_DEEP_ARCHIVE_DAYS:90}
    cleanup-cron: ${STORAGE_CLEANUP_CRON:0 0 3 * * ?}

# Spring Cloud AWS
spring.cloud.aws:
  s3:
    enabled: ${SPRING_CLOUD_AWS_S3_ENABLED:false}
  region:
    static: ${AWS_REGION:ap-northeast-2}
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}

# =========================
# 이메일 설정
# =========================

# =========================
# 로깅
# =========================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.example.sharedprompts.domain.payment: ${PAYMENT_LOG_LEVEL:DEBUG}  # 결제 관련 상세 로깅
