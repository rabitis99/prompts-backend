# =========================
# 서버 설정
# =========================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# =========================
# Spring Config
# =========================
spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: dev

  web:
    resources:
      add-mappings: false

  # =========================
  # OAuth2 클라이언트
  # =========================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            client-name: Google
            authorization-grant-type: authorization_code

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            client-name: Naver
            authorization-grant-type: authorization_code

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-name: Kakao
            authorization-grant-type: authorization_code

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # =========================
  # 데이터베이스
  # =========================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}

  # =========================
  # Redis
  # =========================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # =========================
  # OpenAI AI 설정
  # =========================
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:dummy-openai-api-key}

# =========================
# JWT
# =========================
jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION}

# =========================
# OAuth2 커스텀 정보
# =========================
oauth2:
  failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL}
  salt: ${OAUTH2_SALT}
  redirect:
    front-url: ${OAUTH2_REDIRECT_FRONT_URL}

# =========================
# CORS
# =========================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# =========================
# AI 설정
# =========================
google:
  gemini:
    api-key: ${GOOGLE_GEMINI_API_KEY}
    model: ${GOOGLE_GEMINI_MODEL}
    base-url: ${GOOGLE_GEMINI_BASE_URL}
    timeout-seconds: ${GOOGLE_GEMINI_TIMEOUT_SECONDS:30}

# =========================
# Resilience4j CircuitBreaker 설정
# =========================
# 운영 환경 배포 후 Prometheus 메트릭을 통해 다음을 모니터링하세요:
# - Circuit breaker 상태 전환 빈도
# - Slow call 및 failure 비율
# - Half-open 상태에서의 성공률
# 설정값 조정 권장사항 (AI API 특성 고려):
# - slowCallDurationThreshold: 15s (timeout 30s의 50%)
#   * LLM API는 정상적으로 10~20초 응답이 발생할 수 있으므로
#     slowCallDurationThreshold는 timeout의 50% 이상으로 설정한다.
#   * Gemini/OpenAI/Claude 공통: 6~12초(정상), 12~18초(복잡한 프롬프트 정상), 20초↑(지연 가능성)
#   * 15s는 정상 호출 보호 + 실제 지연 감지를 동시에 만족하는 현실적인 경계선
# - slowCallRateThreshold: 70%
#   * 50%는 너무 공격적. 70% 이상이면 지속적인 지연과 사용자 체감 장애로 간주
#   * 느림만으로는 서킷을 열지 않으며, 진짜 성능 저하 시에만 fallback 활성화
# - failureRateThreshold: 50%는 초기 설정으로 적절하나, 실제 사용 패턴에 따라 조정 필요
# - minimumNumberOfCalls: 10은 충분한 샘플 크기를 확보하기 위한 값으로 적절
resilience4j:
  circuitbreaker:
    instances:
      googleGemini:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        slowCallRateThreshold: 70
        slowCallDurationThreshold: 15s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 10

# =========================
# 로깅
# =========================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
