# =========================
# 서버 설정
# =========================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# =========================
# Spring Config
# =========================
spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: dev

  web:
    resources:
      add-mappings: false

  # =========================
  # OAuth2 클라이언트
  # =========================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email,profile
            redirect-uri: "${BASE_URL:http://localhost:8080}/login/oauth2/code/google"
            client-name: Google
            authorization-grant-type: authorization_code
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope: name,email
            redirect-uri: "${BASE_URL:http://localhost:8080}/login/oauth2/code/naver"
            client-name: Naver
            authorization-grant-type: authorization_code
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope: profile
            redirect-uri: "${BASE_URL:http://localhost:8080}/login/oauth2/code/kakao"
            client-name: Kakao
            authorization-grant-type: authorization_code

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # =========================
  # 데이터베이스
  # =========================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

  # =========================
  # Redis
  # =========================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# =========================
# JWT
# =========================
jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION}

# =========================
# OAuth2 커스텀 정보
# =========================
oauth2:
  failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL}
  salt: ${OAUTH2_SALT}
  redirect:
    front-url: ${OAUTH2_REDIRECT_FRONT_URL}

# =========================
# CORS
# =========================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# =========================
# AI 설정
# =========================
google:
  gemini:
    api-key: ${GOOGLE_GEMINI_API_KEY}
    model: ${GOOGLE_GEMINI_MODEL}
    base-url: ${GOOGLE_GEMINI_BASE_URL}

# =========================
# 로깅
# =========================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
