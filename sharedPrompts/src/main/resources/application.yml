# =========================
# 서버 설정
# =========================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# =========================
# Spring Config
# =========================
spring:
  config:
    import: optional:file:.env[.properties]

  # 프로필 설정
  # 프로필은 환경변수 SPRING_PROFILES_ACTIVE로 설정하거나
  # 실행 시 --spring.profiles.active 옵션으로 지정합니다.
  # 운영 환경에서는 prod 프로필을 사용하는 것을 권장합니다.
  # profiles:
  #   active: ${SPRING_PROFILES_ACTIVE:}

  web:
    resources:
      add-mappings: false

  # =========================
  # OAuth2 클라이언트
  # =========================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            client-name: Google
            authorization-grant-type: authorization_code

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            client-name: Naver
            authorization-grant-type: authorization_code

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            client-name: Kakao
            authorization-grant-type: authorization_code

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # =========================
  # 데이터베이스
  # =========================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
        jdbc:
          batch_size: ${HIBERNATE_BATCH_SIZE:50} # 배치 처리 사이즈

  # =========================
  # Redis
  # =========================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        max-page-size: 100 # 페이지 크기 상한 (클라이언트가 과도한 size 요청 방지)

  # =========================
  # RabbitMQ
  # =========================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: ${RABBITMQ_PREFETCH:10} # Consumer가 한 번에 가져올 메시지 수
        default-requeue-rejected: false # 실패한 메시지 재큐잉 방지
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2

  # =========================
  # Spring AI 설정
  # =========================
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:dummy-openai-api-key}

# =========================
# JWT
# =========================
jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION}
    rotation-threshold-days: ${JWT_REFRESH_ROTATION_THRESHOLD_DAYS:1} # Refresh Token 회전 임계값 (일)

# =========================
# OAuth2 커스텀 설정
# =========================
oauth2:
  failure-redirect-url: ${OAUTH2_FAILURE_REDIRECT_URL}

# =========================
# 쿠키 보안 설정
# =========================
auth:
  cookie:
    # Secure 플래그: HTTPS 환경에서만 쿠키 전송
    # 기본값은 true (보안상 안전한 기본값)
    # 개발 환경에서는 application-dev.yml에서 false로 덮어쓸 수 있습니다.
    secure: ${AUTH_COOKIE_SECURE:true}
    # SameSite 속성: "Strict", "Lax", "None"
    # (Java Cookie API에서 직접 지원하지 않으므로 주석으로만 표시)
    # same-site: Lax
  salt: ${OAUTH2_SALT}
  state:
    validity-minutes: ${OAUTH2_STATE_VALIDITY_MINUTES:10} # OAuth2 State 유효 기간 (분)
  redirect:
    front-url: ${OAUTH2_REDIRECT_FRONT_URL}

# =========================
# 비밀번호 정책
# =========================
password:
  policy:
    min-length: ${PASSWORD_MIN_LENGTH:10}
    max-length: ${PASSWORD_MAX_LENGTH:100}
    require-upper-case: ${PASSWORD_REQUIRE_UPPER_CASE:true}
    require-lower-case: ${PASSWORD_REQUIRE_LOWER_CASE:true}
    require-digit: ${PASSWORD_REQUIRE_DIGIT:true}
    require-special-char: ${PASSWORD_REQUIRE_SPECIAL_CHAR:true}
    special-chars: ${PASSWORD_SPECIAL_CHARS:!@#$%^&*()_+-=[]{}|;:,.<>?}

# =========================
# CORS
# =========================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# =========================
# AI 설정
# =========================
google:
  gemini:
    api-key: ${GOOGLE_GEMINI_API_KEY}
    model: ${GOOGLE_GEMINI_MODEL}
    base-url: ${GOOGLE_GEMINI_BASE_URL}
    timeout-seconds: ${GOOGLE_GEMINI_TIMEOUT_SECONDS:30}

# =========================
# Resilience4j CircuitBreaker 설정
# =========================
# AI API 특성 고려: LLM API는 정상적으로 10~20초 응답이 발생할 수 있으므로
# slowCallDurationThreshold는 timeout의 50% 이상으로 설정합니다.
# 운영 환경에서는 Prometheus 메트릭을 통해 상태 전환 빈도, slow call/failure 비율을 모니터링하세요.
resilience4j:
  circuitbreaker:
    instances:
      googleGemini:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        slowCallRateThreshold: 70
        slowCallDurationThreshold: 15s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 10

# =========================
# 알림 설정
# =========================
notification:
  sse:
    timeout: ${NOTIFICATION_SSE_TIMEOUT:1800000} # 30분 (밀리초)
    cleanup-interval: ${NOTIFICATION_SSE_CLEANUP_INTERVAL:300000} # 5분 (밀리초)
  duplicate:
    check-window-minutes: ${NOTIFICATION_DUPLICATE_CHECK_WINDOW:5} # 중복 체크 시간 윈도우 (분)
  cleanup:
    enabled: ${NOTIFICATION_CLEANUP_ENABLED:true}
    retention-days: ${NOTIFICATION_RETENTION_DAYS:90} # 읽은 알림 보관 기간 (일)
    schedule: ${NOTIFICATION_CLEANUP_SCHEDULE:0 0 2 * * ?} # 매일 새벽 2시
  cache:
    unread-count-ttl: ${NOTIFICATION_UNREAD_COUNT_TTL:60} # 읽지 않은 알림 개수 캐시 TTL (초)

# =========================
# 통계 설정
# =========================
statistics:
  cache:
    ttl: ${STATISTICS_CACHE_TTL:300} # 통계 데이터 캐시 TTL (초, 기본값: 5분)

# =========================
# Rate Limit 설정
# =========================
rate-limit:
  rules:
    login: ${RATE_LIMIT_LOGIN:5} # 로그인 한도 (기본값: 5회)
    signup: ${RATE_LIMIT_SIGNUP:3} # 회원가입 한도 (기본값: 3회)
    prompt-create: ${RATE_LIMIT_PROMPT_CREATE:10} # 프롬프트 생성 한도 (기본값: 10회)
    general: ${RATE_LIMIT_GENERAL:100} # 일반 API 한도 (기본값: 100회)
  windows:
    default-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60} # 기본 윈도우 시간 (초, 기본값: 60초)
  log:
    cleanup:
      enabled: ${RATE_LIMIT_LOG_CLEANUP_ENABLED:true} # Rate Limit 로그 정리 활성화 여부
      retention-days: ${RATE_LIMIT_LOG_CLEANUP_RETENTION_DAYS:90} # Rate Limit 로그 보관 기간 (일)

# =========================
# 애플리케이션 설정
# =========================
app:
  redis:
    hot-ttl-seconds: ${APP_REDIS_HOT_TTL_SECONDS:86400} # 핫 데이터 Redis TTL (초, 기본값: 1일)

# =========================
# Actuator 설정
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus # 노출할 엔드포인트
  endpoint:
    health:
      show-details: when-authorized # 인증된 사용자에게만 상세 정보 표시
  prometheus:
    metrics:
      export:
        enabled: true

# =========================
# 로깅
# =========================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    # 개발 환경에서는 application-dev.yml에서 DEBUG로 설정됩니다.
