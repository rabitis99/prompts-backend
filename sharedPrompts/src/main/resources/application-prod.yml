# =========================
# 운영 환경 설정
# =========================
# 운영 환경에서 적용되는 설정입니다.
# 보안 및 성능 최적화를 위한 설정이 포함되어 있습니다.

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  profiles:
    # 운영 환경에서는 명시적으로 prod 프로필을 활성화해야 합니다.
    # 환경변수 SPRING_PROFILES_ACTIVE=prod 또는 실행 시 --spring.profiles.active=prod 옵션 사용

auth:
  cookie:
    # 운영 환경에서는 반드시 true로 설정 (HTTPS 필수)
    secure: true

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    # 운영 환경에서는 DEBUG 로깅 비활성화

