# =========================
# 운영 환경 설정
# =========================
# 운영 환경에서 적용되는 설정입니다.
# 보안 및 성능 최적화를 위한 설정이 포함되어 있습니다.
#
# 운영 환경에서는 명시적으로 prod 프로필을 활성화해야 합니다.
# 환경변수 SPRING_PROFILES_ACTIVE=prod 또는 실행 시 --spring.profiles.active=prod 옵션 사용

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none

  # =========================
  # 데이터베이스 커넥션 풀 (운영 환경)
  # =========================
  datasource:
    hikari:
      # 운영 환경: 높은 부하 대응을 위한 큰 풀 크기
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:30}  # 최대 커넥션 수
      minimum-idle: ${HIKARI_MINIMUM_IDLE:10}  # 최소 유휴 커넥션
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}  # 커넥션 획득 타임아웃 (30초)
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}  # 유휴 커넥션 타임아웃 (10분)
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}  # 커넥션 최대 생존 시간 (30분)
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:60000}  # 커넥션 누수 감지 (60초)

  # =========================
  # Redis 연결 풀 (운영 환경)
  # =========================
  data:
    redis:
      timeout: ${REDIS_TIMEOUT:5000ms}  # 연결 타임아웃 (운영 환경에서는 더 여유있게)
      lettuce:
        pool:
          # 운영 환경: 높은 부하 대응을 위한 큰 풀 크기
          max-active: ${REDIS_POOL_MAX_ACTIVE:30}  # 최대 연결 수
          max-idle: ${REDIS_POOL_MAX_IDLE:15}  # 최대 유휴 연결
          min-idle: ${REDIS_POOL_MIN_IDLE:10}  # 최소 유휴 연결
          max-wait: ${REDIS_POOL_MAX_WAIT:3000ms}  # 연결 대기 시간

  # =========================
  # RabbitMQ 연결 풀 (운영 환경)
  # =========================
  rabbitmq:
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:10000}  # 연결 타임아웃 (ms, 운영 환경에서는 더 여유있게)
    publisher-confirm-type: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE:correlated}  # 발행 확인 (운영 환경에서는 필수)
    publisher-returns: ${RABBITMQ_PUBLISHER_RETURNS:true}  # 발행 실패 시 반환 (운영 환경에서는 필수)
    template:
      mandatory: ${RABBITMQ_TEMPLATE_MANDATORY:true}  # 라우팅 실패 시 반환 (운영 환경에서는 필수)
    cache:
      connection:
        size: ${RABBITMQ_CACHE_CONNECTION_SIZE:20}  # 연결 캐시 크기 (운영 환경에서는 더 크게)
      channel:
        size: ${RABBITMQ_CACHE_CHANNEL_SIZE:50}  # 채널 캐시 크기 (운영 환경에서는 더 크게)

  # =========================
  # Spring AI (운영 환경)
  # =========================
  ai:
    openai:
      # ⚠️ 프로덕션 환경 필수 설정
      # 운영 환경에서는 반드시 SPRING_AI_OPENAI_API_KEY 환경 변수를 설정해야 합니다.
      # API 키가 없으면 Spring AI가 동작하지 않으며, Google Gemini로 fallback됩니다.
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_MODEL:gpt-4o-mini}
          temperature: ${SPRING_AI_OPENAI_TEMPERATURE:0.7}

auth:
  cookie:
    # 운영 환경에서는 반드시 true로 설정 (HTTPS 필수)
    secure: true

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    # 운영 환경에서는 DEBUG 로깅 비활성화

